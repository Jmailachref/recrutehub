# The whole RecruteHub stack. Open http://localhost (port 80) once it is up.
# Code Playground and CV Analyzer are built from their own repositories, checked
# out next to this one (../code-playground, ../cv-analyzer) unless CODEPLAY_SOURCE
# and CV_ANALYZER_SOURCE say otherwise.
# Development passwords only: every database user's password is its name.

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

x-env: &env
  REDIS_URL: redis://redis:6379/0
  AUTH_URL: http://auth:8000
  AUTH_JWKS_URL: http://auth:8000/jwks
  SERVICE_SECRET: ${SERVICE_SECRET:-dev-service-secret}

x-codeplay: &codeplay
  build: ${CODEPLAY_SOURCE:-../code-playground}
  image: recrutehub/codeplay:local
  environment:
    DATABASE_URL: postgresql+psycopg://codeplay:codeplay@postgres:5432/codeplay_db
    REDIS_URL: redis://redis:6379/1
    API_KEYS: ui:ui-key,recrutehub:${CODEPLAY_API_KEY:-recrutehub-dev-key}
    UI_API_KEY: ui-key
    # Every candidate shares RecruteHub's key; assessments limits each candidate instead.
    RATE_LIMIT_PER_MINUTE: "0"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

# CV Analyzer reads each CV and scores it against its offer's grid, in points.
x-cvanalyzer: &cvanalyzer
  environment:
    DATABASE_URL: postgresql+psycopg://cvanalyzer:cvanalyzer@postgres:5432/cvanalyzer_db
    REDIS_URL: redis://redis:6379/2
    API_KEYS: recrutehub:${CV_ANALYZER_KEY:-recrutehub-cv-dev-key}
    STORAGE: local
    STORAGE_DIR: /data/files
  volumes:
    - cvfiles:/data/files

x-cvanalyzer-client: &cvanalyzer-client
  CV_ANALYZER_URL: http://cvanalyzer-api:8000
  CV_ANALYZER_KEY: ${CV_ANALYZER_KEY:-recrutehub-cv-dev-key}

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  auth:
    <<: *service
    build: { context: ., dockerfile: services/auth/Dockerfile }
    environment:
      <<: *env
      DATABASE_URL: postgresql+psycopg://auth:auth@postgres:5432/auth_db
      # The signing key is created on first start and kept on this volume.
      AUTH_PRIVATE_KEY_FILE: /keys/private.pem
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Development admin, created on start when the email does not exist yet.
      BOOTSTRAP_TENANT: Demo company
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin1234}
    volumes:
      - authkeys:/keys

  offers:
    <<: *service
    build: { context: ., dockerfile: services/offers/Dockerfile }
    environment:
      <<: [*env, *cvanalyzer-client]
      DATABASE_URL: postgresql+psycopg://offers:offers@postgres:5432/offers_db
      SERVICE_NAME: offers
      CODEPLAY_URL: http://codeplay-api:8000
      CODEPLAY_API_KEY: ${CODEPLAY_API_KEY:-recrutehub-dev-key}

  questions:
    <<: *service
    build: { context: ., dockerfile: services/questions/Dockerfile }
    image: recrutehub/questions:local
    environment: &questions-env
      <<: *env
      DATABASE_URL: postgresql+psycopg://questions:questions@postgres:5432/questions_db
      CODEPLAY_URL: http://codeplay-api:8000
      CODEPLAY_API_KEY: ${CODEPLAY_API_KEY:-recrutehub-dev-key}

  questions-worker:
    <<: *service
    build: { context: ., dockerfile: services/questions/Dockerfile }
    image: recrutehub/questions:local
    command: ["python", "-m", "app.worker"]
    environment: *questions-env

  candidates:
    <<: *service
    build: { context: ., dockerfile: services/candidates/Dockerfile }
    image: recrutehub/candidates:local
    environment: &candidates-env
      <<: [*env, *cvanalyzer-client]
      SERVICE_NAME: candidates
      DATABASE_URL: postgresql+psycopg://candidates:candidates@postgres:5432/candidates_db
      S3_URL: http://s3:8333
      S3_ACCESS_KEY: recrutehub
      S3_SECRET_KEY: recrutehub-dev
      S3_BUCKET: cvs

  candidates-worker:
    <<: *service
    build: { context: ., dockerfile: services/candidates/Dockerfile }
    image: recrutehub/candidates:local
    command: ["python", "-m", "app.worker"]
    environment: *candidates-env

  assessments:
    <<: *service
    build: { context: ., dockerfile: services/assessments/Dockerfile }
    image: recrutehub/assessments:local
    environment: &assessments-env
      <<: *env
      SERVICE_NAME: assessments
      DATABASE_URL: postgresql+psycopg://assessments:assessments@postgres:5432/assessments_db
      CODEPLAY_URL: http://codeplay-api:8000
      CODEPLAY_API_KEY: ${CODEPLAY_API_KEY:-recrutehub-dev-key}
      # Where candidates open their test link.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}

  assessments-worker:
    <<: *service
    build: { context: ., dockerfile: services/assessments/Dockerfile }
    image: recrutehub/assessments:local
    command: ["python", "-m", "app.worker"]
    environment: *assessments-env

  notifications:
    <<: *service
    build: { context: ., dockerfile: services/notifications/Dockerfile }
    image: recrutehub/notifications:local
    environment: &notifications-env
      <<: *env
      DATABASE_URL: postgresql+psycopg://notifications:notifications@postgres:5432/notifications_db
      # Mailpit catches every email unless SMTP_HOST points to a real provider.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-RecruteHub <no-reply@recrutehub.local>}

  notifications-worker:
    <<: *service
    build: { context: ., dockerfile: services/notifications/Dockerfile }
    image: recrutehub/notifications:local
    command: ["python", "-m", "app.worker"]
    environment: *notifications-env

  codeplay-migrate:
    <<: *codeplay
    command: ["alembic", "upgrade", "head"]

  codeplay-api:
    <<: *codeplay
    restart: unless-stopped
    # Published on localhost only, to manage coding problems in its web UI.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      codeplay-migrate:
        condition: service_completed_successfully

  codeplay-worker:
    <<: *codeplay
    restart: unless-stopped
    command: ["python", "-m", "runner.worker"]
    # Starts sandbox containers through the host's Docker daemon (root-equivalent).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      codeplay-migrate:
        condition: service_completed_successfully

  # The CV analyzer's database, also on a Postgres volume created before it existed.
  cvanalyzer-db:
    image: postgres:16
    environment:
      PGPASSWORD: postgres
    entrypoint:
      - sh
      - -c
      - |
        psql -h postgres -U postgres -tc "SELECT 1 FROM pg_roles WHERE rolname = 'cvanalyzer'" | grep -q 1 ||
          psql -h postgres -U postgres -c "CREATE ROLE cvanalyzer LOGIN PASSWORD 'cvanalyzer'"
        psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'cvanalyzer_db'" | grep -q 1 ||
          psql -h postgres -U postgres -c "CREATE DATABASE cvanalyzer_db OWNER cvanalyzer" \
            -c "REVOKE CONNECT ON DATABASE cvanalyzer_db FROM PUBLIC"
    depends_on:
      postgres:
        condition: service_healthy

  cvanalyzer-migrate:
    <<: *cvanalyzer
    build: { context: "${CV_ANALYZER_SOURCE:-../cv-analyzer}", target: api }
    image: recrutehub/cvanalyzer-api:local
    command: ["alembic", "upgrade", "head"]
    depends_on:
      cvanalyzer-db:
        condition: service_completed_successfully

  cvanalyzer-api:
    <<: *cvanalyzer
    build: { context: "${CV_ANALYZER_SOURCE:-../cv-analyzer}", target: api }
    image: recrutehub/cvanalyzer-api:local
    restart: unless-stopped
    depends_on:
      cvanalyzer-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  cvanalyzer-worker:
    <<: *cvanalyzer
    build: { context: "${CV_ANALYZER_SOURCE:-../cv-analyzer}", target: worker }
    image: recrutehub/cvanalyzer-worker:local
    restart: unless-stopped
    depends_on:
      cvanalyzer-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SERVICE_DATABASES: auth offers questions candidates assessments notifications codeplay
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  # S3-compatible file storage (SeaweedFS). MinIO no longer publishes images.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-filer"]
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - s3data:/data
      - ./s3/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  s3-setup:
    image: chrislusf/seaweedfs:3.97
    depends_on: [s3]
    entrypoint:
      - sh
      - -c
      - |
        until echo 's3.bucket.list' | weed shell -master=s3:9333 2>/dev/null | grep -q cvs; do
          echo 's3.bucket.create -name cvs' | weed shell -master=s3:9333 >/dev/null 2>&1
          sleep 2
        done

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  cvfiles:
  authkeys:
  pgdata:
  s3data:
