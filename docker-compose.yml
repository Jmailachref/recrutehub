# The whole RecruteHub stack. Open http://localhost (port 80) once it is up.
# Code Playground is built from its own repository, checked out next to this
# one (../code-playground) unless CODEPLAY_SOURCE says otherwise.
# Development passwords only: every database user's password is its name.

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

x-env: &env
  REDIS_URL: redis://redis:6379/0
  AUTH_JWKS_URL: http://auth:8000/jwks

x-codeplay: &codeplay
  build: ${CODEPLAY_SOURCE:-../code-playground}
  image: recrutehub/codeplay:local
  environment:
    DATABASE_URL: postgresql+psycopg://codeplay:codeplay@postgres:5432/codeplay_db
    REDIS_URL: redis://redis:6379/1
    API_KEYS: ui:ui-key,recrutehub:${CODEPLAY_API_KEY:-recrutehub-dev-key}
    UI_API_KEY: ui-key
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  auth:
    <<: *service
    build: { context: ., dockerfile: services/auth/Dockerfile }
    environment:
      <<: *env
      DATABASE_URL: postgresql+psycopg://auth:auth@postgres:5432/auth_db

  offers:
    <<: *service
    build: { context: ., dockerfile: services/offers/Dockerfile }
    environment:
      <<: *env
      DATABASE_URL: postgresql+psycopg://offers:offers@postgres:5432/offers_db

  questions:
    <<: *service
    build: { context: ., dockerfile: services/questions/Dockerfile }
    image: recrutehub/questions:local
    environment: &questions-env
      <<: *env
      DATABASE_URL: postgresql+psycopg://questions:questions@postgres:5432/questions_db
      CODEPLAY_URL: http://codeplay-api:8000
      CODEPLAY_API_KEY: ${CODEPLAY_API_KEY:-recrutehub-dev-key}

  questions-worker:
    <<: *service
    build: { context: ., dockerfile: services/questions/Dockerfile }
    image: recrutehub/questions:local
    command: ["python", "-m", "app.worker"]
    environment: *questions-env

  candidates:
    <<: *service
    build: { context: ., dockerfile: services/candidates/Dockerfile }
    image: recrutehub/candidates:local
    environment: &candidates-env
      <<: *env
      DATABASE_URL: postgresql+psycopg://candidates:candidates@postgres:5432/candidates_db
      S3_URL: http://s3:8333
      S3_ACCESS_KEY: recrutehub
      S3_SECRET_KEY: recrutehub-dev
      S3_BUCKET: cvs

  candidates-worker:
    <<: *service
    build: { context: ., dockerfile: services/candidates/Dockerfile }
    image: recrutehub/candidates:local
    command: ["python", "-m", "app.worker"]
    environment: *candidates-env

  assessments:
    <<: *service
    build: { context: ., dockerfile: services/assessments/Dockerfile }
    environment:
      <<: *env
      DATABASE_URL: postgresql+psycopg://assessments:assessments@postgres:5432/assessments_db
      CODEPLAY_URL: http://codeplay-api:8000
      CODEPLAY_API_KEY: ${CODEPLAY_API_KEY:-recrutehub-dev-key}

  notifications:
    <<: *service
    build: { context: ., dockerfile: services/notifications/Dockerfile }
    image: recrutehub/notifications:local
    environment: &notifications-env
      <<: *env
      DATABASE_URL: postgresql+psycopg://notifications:notifications@postgres:5432/notifications_db
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: RecruteHub <no-reply@recrutehub.local>

  notifications-worker:
    <<: *service
    build: { context: ., dockerfile: services/notifications/Dockerfile }
    image: recrutehub/notifications:local
    command: ["python", "-m", "app.worker"]
    environment: *notifications-env

  codeplay-migrate:
    <<: *codeplay
    command: ["alembic", "upgrade", "head"]

  codeplay-api:
    <<: *codeplay
    restart: unless-stopped
    # Published on localhost only, to manage coding problems in its web UI.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      codeplay-migrate:
        condition: service_completed_successfully

  codeplay-worker:
    <<: *codeplay
    restart: unless-stopped
    command: ["python", "-m", "runner.worker"]
    # Starts sandbox containers through the host's Docker daemon (root-equivalent).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      codeplay-migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SERVICE_DATABASES: auth offers questions candidates assessments notifications codeplay
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  # S3-compatible file storage (SeaweedFS). MinIO no longer publishes images.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-filer"]
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - s3data:/data
      - ./s3/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  s3-setup:
    image: chrislusf/seaweedfs:3.97
    depends_on: [s3]
    entrypoint:
      - sh
      - -c
      - |
        until echo 's3.bucket.list' | weed shell -master=s3:9333 2>/dev/null | grep -q cvs; do
          echo 's3.bucket.create -name cvs' | weed shell -master=s3:9333 >/dev/null 2>&1
          sleep 2
        done

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
