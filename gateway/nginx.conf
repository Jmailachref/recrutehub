# The only public entry point.
#   /api/<service>/...  -> that service, with the /api/<service> prefix removed
#   /api/<service>/internal/... is never forwarded: it is for service-to-service calls only
#   everything else     -> the Next.js frontend
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  client_max_body_size 10m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location ~ ^/api/(auth|offers|questions|candidates|assessments|notifications)/internal(/|$) {
    return 404;
  }

  location ~ ^/api/(auth|offers|questions|candidates|assessments|notifications)(/.*)?$ {
    set $service $1;
    set $rest $2;
    proxy_pass http://$service:8000$rest$is_args$args;
  }

  location /api/ {
    default_type application/json;
    return 404 '{"error":{"code":"not_found","message":"Unknown service"}}';
  }

  location / {
    set $frontend frontend;
    proxy_pass http://$frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
