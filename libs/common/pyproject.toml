[project]
name = "rh-common"
version = "0.1.0"
description = "Code shared by every RecruteHub service: app factory, tokens, errors, database, queues."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "PyJWT[crypto]>=2.9",
  "redis>=5.0",
  "SQLAlchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rh_common"]
